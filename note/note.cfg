# ld65 configuration for NOTE: the bank part (NOTE, $E000, below the name
# at $EF80) and the main-RAM part (NOTE2, $0800-$17FF)
MEMORY {
    BANK: start = $E000, size = $0F80, type = rw, file = "note.bin";
    LOW:  start = $0800, size = $1000, type = rw, file = "note2.bin";
}
SEGMENTS {
    BANK: load = BANK, type = rw;
    LOW:  load = LOW, type = rw;
}
