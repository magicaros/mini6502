# ld65 configuration for PAINT: the bank part (PAINT, $E000, below the name
# at $EF80) and the main-RAM part (PAINT2, $0800-$3FFF)
MEMORY {
    BANK: start = $E000, size = $0F80, type = rw, file = "paint.bin";
    LOW:  start = $0800, size = $3800, type = rw, file = "paint2.bin";
}
SEGMENTS {
    BANK: load = BANK, type = rw;
    LOW:  load = LOW, type = rw;
}
