# ld65 configuration for PIXEL: the loader for a bank (PIXEL, $E000) and
# the program in main RAM (PIXEL2, $0800-$1FFF)
MEMORY {
    BANK: start = $E000, size = $0F80, type = rw, file = "pixel.bin";
    RAM:  start = $0800, size = $1800, type = rw, file = "pixel2.bin";
}
SEGMENTS {
    BANK: load = BANK, type = rw;
    CODE: load = RAM, type = rw;
}
