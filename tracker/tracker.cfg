# ld65 configuration for TRACKER: the bank part (TRACKER, $E000, below the
# name at $EF80) and the main-RAM part (TRACKER2, $0800-$1FFF)
MEMORY {
    BANK: start = $E000, size = $0F80, type = rw, file = "tracker.bin";
    LOW:  start = $0800, size = $1800, type = rw, file = "tracker2.bin";
}
SEGMENTS {
    BANK: load = BANK, type = rw;
    LOW:  load = LOW, type = rw;
}
