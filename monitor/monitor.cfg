# ld65 configuration for the mini6502 monitor ROM ($F000-$FFFF, 4K)
MEMORY {
    ROM: start = $F000, size = $1000, type = ro, fill = yes, fillval = $FF, file = %O;
}
SEGMENTS {
    CODE:        load = ROM, type = ro;
    WOZ_RESET:   load = ROM, type = ro, start = $FF00;
    WOZ_GETLINE: load = ROM, type = ro, start = $FF1F;
    SYSCALLS:    load = ROM, type = ro, start = $FFB0;
    FARCALL:     load = ROM, type = ro, start = $FFD0;
    WOZ_PRBYTE:  load = ROM, type = ro, start = $FFDC;
    WOZ_PRHEX:   load = ROM, type = ro, start = $FFE5;
    WOZ_ECHO:    load = ROM, type = ro, start = $FFEF;
    VECTORS:     load = ROM, type = ro, start = $FFFA;
}
